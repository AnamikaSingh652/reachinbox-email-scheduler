services:
  - type: web
    name: reachinbox-email-scheduler
    env: node
    buildCommand: npm run build
    startCommand: node apps/backend/dist/server.js
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: WORKER_CONCURRENCY
        value: 5

databases:
  - name: reachinbox-db
    databaseName: reachinbox
    user: reachinbox_user
